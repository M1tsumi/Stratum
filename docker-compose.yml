version: '3.8'

services:
  stratum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stratum-s3
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:9000
    restart: unless-stopped
    networks:
      - stratum-network

  prometheus:
    image: prom/prometheus:latest
    container_name: stratum-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - stratum-network

  grafana:
    image: grafana/grafana:latest
    container_name: stratum-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - stratum-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  stratum-network:
    driver: bridge
